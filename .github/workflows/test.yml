name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: node --check lib/index.js
      - run: node --check lib/client.js
      - run: node --check lib/typert.host.js
      - run: node --check lib/typert.remote-client.js
      # Packaging drift: every path in files[] must exist, and the bundle patch
      # must be both declared and shipped, or `dsh plugin add` silently stops
      # inserting the plugin and installs it as a plain dependency.
      - run: |
          node -e '
          const fs = require("node:fs");
          const pkg = require("./package.json");
          const missing = (pkg.files ?? []).filter((f) => !fs.existsSync(f));
          if (missing.length) throw new Error("files[] paths do not exist: " + missing.join(", "));
          const patch = pkg.dsh?.bundle?.patch;
          if (!patch) throw new Error("package.json declares no dsh.bundle.patch");
          if (!(pkg.files ?? []).includes(patch.replace("./", ""))) throw new Error("bundle patch is declared but not shipped in files[]: " + patch);
          console.log("manifest ok: " + pkg.name + "@" + pkg.version + " ships " + patch);
          '
      - run: node --test lib/ssh.test.js lib/client.test.js
